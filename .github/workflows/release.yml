name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source:
    name: source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify cleanroom input
        run: sha256sum -c docs/SHA256SUMS

      - name: Create source archive
        run: |
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="fpc-disum-driver-${GITHUB_REF_NAME}/" \
            -o "dist/fpc-disum-driver-${GITHUB_REF_NAME}.tar.gz" \
            HEAD

      - name: Create checksums
        run: |
          cd dist
          sha256sum "fpc-disum-driver-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: dist/*

  release:
    name: publish GitHub release
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-release
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "fpc-disum-driver ${GITHUB_REF_NAME}" \
            --notes "Experimental libfprint driver for FPC Disum 10a5:9201. Source and SHA256SUMS only; AUR and distribution packaging are downstream. PAM/display-manager wiring is host-specific."
