# Development-only defaults; no system installation or physical driver probes.
[built-in options]
buildtype = 'debug'
c_std = 'gnu99'
prefix = '@GLOBAL_SOURCE_ROOT@/_build/stage'

[project options]
drivers = 'virtual_image,virtual_device,virtual_device_storage'
introspection = false
doc = false
gtk-examples = false
installed-tests = false
udev_rules = 'disabled'
udev_hwdb = 'disabled'
