# Development-only defaults; use with the system Meson and --native-file.
[built-in options]
buildtype = 'debug'
c_std = 'gnu99'

[project options]
drivers = 'virtual_image,virtual_device,virtual_device_storage'
introspection = false
doc = false
gtk-examples = false
installed-tests = false
udev_rules = 'disabled'
udev_hwdb = 'disabled'
