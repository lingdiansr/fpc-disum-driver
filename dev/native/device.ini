# Layer on common.ini.  This profile compiles the project's own driver into
# libfprint, which is what the authorised hardware work needs.  Nothing here
# talks to the sensor by itself, but any command run with this profile that
# enumerates devices may claim it: run only the targets listed in the README.
[project options]
drivers = 'fpc_disum,virtual_image,virtual_device,virtual_device_storage'
